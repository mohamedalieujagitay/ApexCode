# cargo-audit configuration
# See: https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]
# Ignore warnings for unmaintained/unsound transitive dependencies
# that we cannot directly control. These are indirect deps pulled in
# by candle-core, ratatui, and async-openai internals.
ignore = [
    # backoff 0.4.0 - unmaintained (transitive via older async-openai internals)
    "RUSTSEC-2025-0012",
    # instant 0.1.x - unmaintained (transitive via backoff)
    "RUSTSEC-2024-0384",
    # paste 1.0.x - unmaintained (transitive via candle-core / ratatui / gemm)
    "RUSTSEC-2024-0436",
    # rustls-pemfile 1.x - unmaintained (transitive via reqwest/rustls-native-certs)
    "RUSTSEC-2025-0134",
    # lru 0.12.x - unsound IterMut (transitive via ratatui)
    "RUSTSEC-2026-0002",
]
