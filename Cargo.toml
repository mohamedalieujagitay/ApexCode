[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/detector",
    "crates/humanizer",
    "crates/jitter",
    "crates/undercover",
    "crates/cli",
    "crates/tui",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Mohamed Alieu Jagitay <badaraaliyadev@gmail.com>"]
license = "Apache-2.0 AND MIT"
readme = "README.md"
description = "Write and audit human-sounding code, comments and commits: detection, humanization and pre-commit tooling."
repository = "https://github.com/mohamedalieujagitay/ApexCode"
homepage = "https://mohamedalieujagitay.github.io/ApexCode/"
keywords = ["ai", "humanizer", "git", "stealth", "agent"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Core
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
async-trait = "0.1"

# CLI
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"

# ML/AI
candle-core = "0.10"
candle-transformers = "0.10"
candle-nn = "0.10"

# Cloud APIs
reqwest = { version = "0.12", features = ["json"] }
async-openai = "0.28"

# Git
git2 = "0.19"

# TUI
ratatui = "0.26"
crossterm = "0.27"

# Text processing
regex = "1.10"

# Randomness
rand = "0.8"

# Language parsers
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
tree-sitter = "0.20"
tree-sitter-python = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-go = "0.20"
tree-sitter-cpp = "0.20"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
